name: Daily Data Scraping & AI Sentiment Pipeline

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  # Memungkinkan pemicuan manual dari tab Actions di repositori GitHub
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper (Penarikan Data dari Apify)
      # continue-on-error: true memastikan pipeline AI tetap berjalan
      # meskipun scraper gagal (misal: APIFY_API_TOKEN belum diisi)
      continue-on-error: true
      env:
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python 01_run_scraper.py

    - name: Run AI & ML Sentiment Pipeline (Standardisasi & Prediksi Sentimen)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python 01_pipeline_data.py

